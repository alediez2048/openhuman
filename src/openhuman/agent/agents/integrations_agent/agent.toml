id = "integrations_agent"
display_name = "Integrations Agent"
when_to_use = "Service integration specialist — drives a SINGLE Composio toolkit per spawn (gmail, notion, github, slack, …). The `toolkit` argument is mandatory. Use when a task should be completed via a managed OAuth integration rather than raw HTTP / file I/O."
temperature = 0.4
max_iterations = 10
sandbox_mode = "none"
omit_identity = true
omit_memory_context = true
omit_safety_preamble = false
omit_skills_catalog = true

[model]
hint = "agentic"

[tools]
# F-20: `composio_list_toolkits` added so the agent can confirm a
# toolkit's slug exists before drilling into `composio_list_tools` /
# `composio_execute`. workflow_node already has it; integrations_agent
# was missing it, which forced the LLM to guess at toolkit names.
named = [
    "composio_list_toolkits",
    "composio_list_tools",
    "file_read",
    "composio_execute",
]
